<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements — Gion Terrence Pozon</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .achievement-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .achievement-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-3px);
    }

    .achievement-card-body {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .achievement-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
    }

    .achievement-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: var(--slate-light);
    }

    /* Placeholder image style */
    .achievement-img-placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--slate-light);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    /* PDF preview */
    .achievement-pdf-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: none;
      display: block;
      background: var(--slate-light);
      overflow: auto;
    }

    /* Link preview */
    .achievement-link-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--slate-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: var(--text-secondary);
    }

    .achievement-link-preview svg {
      opacity: 0.35;
    }

    .achievement-link-preview span {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* PDF / Link action bar */
    .achievement-action {
      padding: 0.9rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .achievements-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .achievements-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <div class="page-header">
      <p class="page-header-label">Competitions and Certificates</p>
      <h1>Achievements</h1>
    </div>

    <div class="section">
      <div class="achievements-grid" id="achievementsGrid"></div>
    </div>

  </div>

  <script src="data/achievements.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    // ── RENDER ACHIEVEMENTS FROM achievementsData ─────────────
    function isPlaceholderFile(file) {
      return !file || file.includes('placeholder') || file.includes('REPLACE_WITH');
    }

    function renderAchievementCard(item) {
      const titleIsPlaceholder = item.title.startsWith('[PLACEHOLDER]');

      // Bottom section varies by type
      let bottomHtml = '';

      if (item.type === 'img') {
        if (isPlaceholderFile(item.file)) {
          bottomHtml = `<div class="achievement-img-placeholder">Image placeholder</div>`;
        } else {
          bottomHtml = `
            <img src="${item.file}" alt="${item.title}" class="achievement-img"
              onerror="this.outerHTML='<div class=\\'achievement-img-placeholder\\'>Image not found</div>'" />
          `;
        }
      } else if (item.type === 'pdf') {
        const isDisabled = isPlaceholderFile(item.file);
        const preview = isDisabled
          ? `<div class="achievement-img-placeholder">PDF placeholder</div>`
          : `<iframe src="${item.file}" class="achievement-pdf-preview" title="${item.title}"></iframe>`;
        bottomHtml = `
          ${preview}
          <div class="achievement-action">
            <span class="tag">PDF</span>
            ${isDisabled
              ? `<button class="btn btn-outline" disabled style="opacity:0.45; cursor:not-allowed;">View PDF</button>`
              : `<a href="${item.file}" target="_blank" class="btn btn-slate">View PDF</a>`
            }
          </div>
        `;
      } else {
        // link
        const isDisabled = isPlaceholderFile(item.file);
        bottomHtml = `
          <div class="achievement-link-preview">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <span>External Link</span>
          </div>
          <div class="achievement-action">
            <span class="tag">LINK</span>
            ${isDisabled
              ? `<button class="btn btn-outline" disabled style="opacity:0.45; cursor:not-allowed;">Open Link</button>`
              : `<a href="${item.file}" target="_blank" class="btn btn-slate">Open Link</a>`
            }
          </div>
        `;
      }

      return `
        <div class="achievement-card">
          <div class="achievement-card-body">
            ${titleIsPlaceholder
              ? `<p class="placeholder-text">${item.title}</p>`
              : `<h3 class="achievement-title">${item.title}</h3>`
            }
          </div>
          ${bottomHtml}
        </div>
      `;
    }

    function renderAchievements() {
      const grid = document.getElementById('achievementsGrid');
      grid.innerHTML = achievementsData.map(renderAchievementCard).join('');
    }

    renderAchievements();
    initPage('achievements');
  </script>
</body>
</html>
